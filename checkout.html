<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | ELITE iPhone Store</title>
<style>



* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
    color: white;
    overflow-x: hidden;
}

a {
    text-decoration: none;
    color: inherit;
}



.checkout-section {
    min-height: 100vh;

    padding: 100px 7%;

    background:
        radial-gradient(
            circle at 80% 20%,
            rgba(255,255,255,0.07),
            transparent 35%
        ),
        #050505;
}



.checkout-heading {
    max-width: 750px;

    margin: 0 auto 60px;
}

.checkout-label {
    margin-bottom: 20px;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: 4px;

    color: #777;
}

.checkout-heading h1 {
    font-size: clamp(50px, 7vw, 85px);

    line-height: 0.95;

    letter-spacing: -4px;

    margin-bottom: 25px;
}

.checkout-heading h1 span {
    color: #999;
}

.checkout-heading > p:last-child {
    color: #777;

    font-size: 15px;

    line-height: 1.8;
}




.checkout-container {
    max-width: 1200px;

    margin: auto;

    display: grid;

    grid-template-columns: 1fr 380px;

    gap: 30px;

    align-items: start;
}




.checkout-form {
    padding: 40px;

    background: #0b0b0b;

    border: 1px solid rgba(255,255,255,0.08);
}

.checkout-form h2,
.checkout-summary h2 {
    font-size: 17px;

    letter-spacing: 1px;

    margin-bottom: 30px;
}

.form-row {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}

.form-group {
    margin-bottom: 22px;
}

.form-group label {
    display: block;

    margin-bottom: 9px;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 2px;

    color: #666;
}

.form-group input,
.form-group select {
    width: 100%;

    padding: 15px;

    border: 1px solid rgba(255,255,255,0.1);

    outline: none;

    background: #111;

    color: white;

    font-size: 13px;

    transition: 0.3s ease;
}

.form-group input:focus,
.form-group select:focus {
    border-color: rgba(255,255,255,0.4);
}

.form-group input::placeholder {
    color: #555;
}

.delivery-title {
    padding-top: 20px;

    margin-top: 20px;

    border-top: 1px solid rgba(255,255,255,0.08);
}



.checkout-summary {
    padding: 35px;

    background: #0b0b0b;

    border: 1px solid rgba(255,255,255,0.1);

    position: sticky;

    top: 30px;
}

.checkout-item {
    display: flex;

    align-items: center;

    gap: 15px;

    margin-bottom: 20px;
}

.checkout-item img {
    width: 70px;

    height: 70px;

    object-fit: contain;

    background: rgba(255,255,255,0.04);
}

.checkout-item-info {
    flex: 1;
}

.checkout-item-info h3 {
    font-size: 14px;

    margin-bottom: 5px;
}

.checkout-item-info p {
    color: #666;

    font-size: 11px;
}

.checkout-item-price {
    font-size: 13px;

    font-weight: 700;
}

.checkout-line {
    height: 1px;

    background: rgba(255,255,255,0.1);

    margin: 25px 0;
}

.checkout-total {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 30px;
}

.checkout-total span {
    font-size: 10px;

    font-weight: 700;

    letter-spacing: 2px;

    color: #777;
}

.checkout-total strong {
    font-size: 22px;
}




.place-order {
    width: 100%;

    padding: 16px;

    border: none;

    border-radius: 50px;

    background: white;

    color: black;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1.5px;

    cursor: pointer;

    transition: 0.3s ease;
}

.place-order:hover {
    transform: translateY(-4px);

    box-shadow:
        0 15px 35px rgba(255,255,255,0.15);
}

.back-cart {
    display: block;

    margin-top: 20px;

    text-align: center;

    color: #666;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1px;

    transition: 0.3s ease;
}

.back-cart:hover {
    color: white;
}




@media (max-width: 900px) {

    .checkout-container {
        grid-template-columns: 1fr;
    }

    .checkout-summary {
        position: relative;

        top: 0;
    }

}


@media (max-width: 600px) {

    .checkout-section {
        padding: 70px 6%;
    }

    .checkout-heading h1 {
        font-size: 52px;

        letter-spacing: -3px;
    }

    .checkout-form {
        padding: 25px;
    }

    .form-row {
        grid-template-columns: 1fr;
    }

    .checkout-summary {
        padding: 25px;
    }

}


.order-success {
    min-height: 75vh;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 60px 20px;
}

.success-icon {
    width: 80px;
    height: 80px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 10px 0 35px;

    border: 1px solid rgba(255,255,255,0.3);

    border-radius: 50%;

    font-size: 32px;

    animation: successPop 0.6s ease;
}

.order-success h1 {
    font-size: clamp(45px, 7vw, 80px);

    line-height: 1;

    letter-spacing: -4px;

    margin-bottom: 25px;
}

.order-success h1 span {
    color: #999;
}

.order-success > p:not(.checkout-label) {
    max-width: 500px;

    color: #777;

    font-size: 15px;

    line-height: 1.8;

    margin-bottom: 30px;
}

.order-number {
    min-width: 280px;

    padding: 25px 35px;

    margin-bottom: 35px;

    border: 1px solid rgba(255,255,255,0.1);

    background: #0b0b0b;
}

.order-number span {
    display: block;

    color: #666;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 3px;

    margin-bottom: 10px;
}

.order-number strong {
    font-size: 22px;

    letter-spacing: 2px;
}

.success-button {
    display: inline-block;

    padding: 16px 32px;

    border-radius: 50px;

    background: white;

    color: black;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1.5px;

    transition: 0.3s ease;
}

.success-button:hover {
    transform: translateY(-4px);

    box-shadow:
        0 15px 35px rgba(255,255,255,0.15);
}

.success-link {
    margin-top: 20px;

    color: #666;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 1px;

    transition: 0.3s ease;
}

.success-link:hover {
    color: white;
}

@keyframes successPop {

    0% {
        opacity: 0;
        transform: scale(0.5);
    }

    70% {
        transform: scale(1.1);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }

}
</style>
</head>

<body>
<section class="checkout-section">

    <div class="checkout-heading">

        <p class="checkout-label">
            SECURE CHECKOUT
        </p>

        <h1>
            COMPLETE YOUR
            <span>ORDER.</span>
        </h1>

        <p>
            Enter your details below to complete your
            ELITE iPhone order.
        </p>

    </div>


    <div class="checkout-container">


        
        <div class="checkout-form">

            <h2>
                CUSTOMER DETAILS
            </h2>

            <div class="form-row">

                <div class="form-group">

                    <label>
                        FIRST NAME
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="Enter your first name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        LAST NAME
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="Enter your last name"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    EMAIL ADDRESS
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    PHONE NUMBER
                </label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="+27 00 000 0000"
                    required
                >

            </div>


            <h2 class="delivery-title">
                DELIVERY DETAILS
            </h2>


            <div class="form-group">

                <label>
                    STREET ADDRESS
                </label>

                <input
                    type="text"
                    id="address"
                    placeholder="Enter your street address"
                    required
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        CITY
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="City"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        POSTAL CODE
                    </label>

                    <input
                        type="text"
                        id="postalCode"
                        placeholder="Postal code"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>
                    COUNTRY
                </label>

                <select id="country" required>

                    <option value="">
                        Select country
                    </option>

                    <option value="South Africa">
                        South Africa
                    </option>

                </select>

            </div>

        </div>


        <div class="checkout-summary">

            <h2>
                YOUR ORDER
            </h2>

            <div id="checkoutItems">

                

            </div>


            <div class="checkout-line"></div>


            <div class="checkout-total">

                <span>
                    TOTAL
                </span>

                <strong id="checkoutTotal">
                    R0
                </strong>

            </div>


            <button
                type="button"
                class="place-order"
                onclick="placeOrder()"
            >
                PLACE ORDER
            </button>


            <a
                href="cart.html"
                class="back-cart"
            >
                BACK TO CART
            </a>

        </div>

    </div>

</section>

</body>
<script>

function loadCheckout() {

    let cart =
        JSON.parse(localStorage.getItem("eliteCart")) || [];

    const checkoutItems =
        document.getElementById("checkoutItems");

    const checkoutTotal =
        document.getElementById("checkoutTotal");

    checkoutItems.innerHTML = "";

    let total = 0;


    if (cart.length === 0) {

        checkoutItems.innerHTML = `
            <p style="color:#777; line-height:1.7;">
                Your cart is empty.
                <br><br>
                Please return to the shop and
                select an iPhone.
            </p>
        `;

        checkoutTotal.textContent = "R0";

        return;
    }


    cart.forEach(product => {

        total += product.price;

        const item =
            document.createElement("div");

        item.className = "checkout-item";


        item.innerHTML = `

            <img
                src="${product.image}"
                alt="${product.name}"
            >

            <div class="checkout-item-info">

                <h3>
                    ${product.name}
                </h3>

                <p>
                    ELITE iPhone Collection
                </p>

            </div>

            <strong class="checkout-item-price">
                R${product.price.toLocaleString()}
            </strong>

        `;


        checkoutItems.appendChild(item);

    });


    checkoutTotal.textContent =
        "R" + total.toLocaleString();

}


loadCheckout();

function placeOrder() {

    const firstName =
        document.getElementById("firstName").value.trim();

    const lastName =
        document.getElementById("lastName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const address =
        document.getElementById("address").value.trim();

    const city =
        document.getElementById("city").value.trim();

    const postalCode =
        document.getElementById("postalCode").value.trim();

    const country =
        document.getElementById("country").value;


    if (
        !firstName ||
        !lastName ||
        !email ||
        !phone ||
        !address ||
        !city ||
        !postalCode ||
        !country
    ) {

        alert(
            "Please complete all customer and delivery details."
        );

        return;
    }


    const cart =
        JSON.parse(localStorage.getItem("eliteCart")) || [];


    if (cart.length === 0) {

        alert(
            "Your cart is empty. Please select an iPhone first."
        );

        return;
    }


    const orderNumber =
        "EL-" +
        Math.floor(100000 + Math.random() * 900000);


    localStorage.setItem(
        "eliteOrderNumber",
        orderNumber
    );


    localStorage.removeItem("eliteCart");


    document.querySelector(".checkout-section").innerHTML = `

        <div class="order-success">

            <p class="checkout-label">
                ORDER CONFIRMED
            </p>

            <div class="success-icon">
                ✓
            </div>

            <h1>
                THANK YOU,
                <span>${firstName.toUpperCase()}.</span>
            </h1>

            <p>
                Your ELITE iPhone order has been
                successfully placed.
            </p>

            <div class="order-number">

                <span>
                    ORDER NUMBER
                </span>

                <strong>
                    ${orderNumber}
                </strong>

            </div>

            <a
                href="home.html"
                class="success-button"
            >
                RETURN TO HOME
            </a>

            <a
                href="shop.html"
                class="success-link"
            >
                CONTINUE SHOPPING
            </a>

        </div>

    `;

}
</script>

</html>
